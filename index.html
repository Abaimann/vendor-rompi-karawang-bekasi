<!DOCTYPE html>
<html lang="id">
<head>

    <!-- Color scheme declaration to prevent Realme UI forced dark inversion -->
    <meta name="color-scheme" content="dark only">
    <meta name="supported-color-schemes" content="dark">
    <meta name="theme-color" content="#090D16">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VESTVENDORS // 100 Vendor Rompi Karawang-Bekasi</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark only;
            --bg: #0A0E17;
            --surface: #111827;
            --surface-elevated: #1F2937;
            --surface-card: #151D2E;
            --border-card: #334155;
            --border-card-hover: #38BDF8;
            --border-sharp: #000000;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --yellow: #FACC15;
            --orange: #FB923C;
            --cyan: #38BDF8;
            --green: #22C55E;
            --green-dark: #15803D;
            --red: #F87171;
            --shadow-hard: 3.5px 3.5px 0px #000000;
            --shadow-hard-sm: 2px 2px 0px #000000;
            --shadow-hard-lg: 5px 5px 0px #000000;
            --radius-sharp: 0px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg);
            color-scheme: dark only;
        }

        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 24px 24px;
            padding-bottom: max(90px, calc(75px + env(safe-area-inset-bottom)));
        }

        .mono {
            font-family: 'Space Mono', 'Consolas', 'Courier New', monospace;
        }

        /* APP HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            background: rgba(10, 14, 23, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 2.5px solid #000000;
            box-shadow: 0 4px 18px rgba(0,0,0,0.7);
            padding-top: env(safe-area-inset-top);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .brand-badge {
            background: var(--yellow);
            color: #000000;
            font-weight: 900;
            font-size: 13px;
            padding: 4px 7px;
            border: 2px solid #000000;
            box-shadow: var(--shadow-hard-sm);
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-title span {
            color: var(--cyan);
        }

        .counter-badge {
            background: var(--surface-elevated);
            color: var(--yellow);
            border: 2px solid #000000;
            box-shadow: var(--shadow-hard-sm);
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px var(--green);
            animation: pulse 1.6s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.5; }
        }

        /* SEARCH & CONTROLS */
        .controls-wrapper {
            padding: 0 14px 10px 14px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .search-container {
            position: relative;
            margin-bottom: 8px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: var(--surface);
            border: 2px solid #334155;
            color: #FFFFFF;
            padding: 10px 40px 10px 12px;
            font-size: 13.5px;
            font-weight: 600;
            border-radius: var(--radius-sharp);
            box-shadow: var(--shadow-hard-sm);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--cyan);
            box-shadow: 3px 3px 0px var(--cyan);
            background: #0F172A;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--yellow);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .clear-btn {
            position: absolute;
            right: 34px;
            top: 50%;
            transform: translateY(-50%);
            background: #1E293B;
            border: 1px solid #334155;
            color: #CBD5E1;
            width: 22px;
            height: 22px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* HORIZONTAL SCROLL CHIPS */
        .chip-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2px;
            width: 100%;
        }

        .chip-scroll::-webkit-scrollbar {
            display: none;
        }

        .chip {
            white-space: nowrap;
            background: var(--surface);
            color: var(--text-muted);
            border: 1.5px solid #334155;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow-hard-sm);
            transition: all 0.15s ease;
            flex-shrink: 0;
            border-radius: var(--radius-sharp);
        }

        .chip:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000000;
        }

        .chip.active {
            background: var(--yellow);
            color: #000000;
            border-color: #000000;
            font-weight: 900;
        }

        .chip-tag.active {
            background: var(--cyan);
            color: #000000;
            border-color: #000000;
        }

        /* STATS STRIP */
        .stats-strip {
            max-width: 1200px;
            margin: 10px auto 6px auto;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            width: 100%;
        }

        .stats-text {
            color: var(--text-muted);
            font-weight: 700;
        }

        .stats-text strong {
            color: var(--yellow);
        }

        .reset-filter-btn {
            background: transparent;
            border: 1px dashed var(--orange);
            color: var(--orange);
            font-size: 11px;
            font-weight: 800;
            padding: 3px 7px;
            cursor: pointer;
            display: none;
            border-radius: var(--radius-sharp);
        }

        /* MAIN GRID */
        .vendor-grid {
            max-width: 1200px;
            margin: 6px auto;
            padding: 0 14px;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 12px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .vendor-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }
        }

        @media (min-width: 960px) {
            .vendor-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 16px;
            }
        }

        /* SHARP VENDOR CARD (AMOLED OPTIMIZED) */
        .card {
            background: var(--surface-card);
            border: 2px solid var(--border-card);
            box-shadow: var(--shadow-hard);
            padding: 14px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            width: 100%;
            border-radius: var(--radius-sharp);
            transition: transform 0.18s ease, border-color 0.18s ease;
        }

        .card:hover {
            border-color: var(--cyan);
            box-shadow: var(--shadow-hard-lg);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 6px;
        }

        .card-id {
            background: #000000;
            color: var(--yellow);
            font-weight: 900;
            font-size: 10.5px;
            padding: 2.5px 6px;
            border: 1px solid #334155;
            display: inline-block;
        }

        .card-region {
            background: #1E293B;
            color: var(--cyan);
            border: 1px solid #334155;
            font-size: 9.5px;
            font-weight: 800;
            padding: 2.5px 5px;
            text-transform: uppercase;
        }

        .card-title {
            font-size: 15.5px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 3px;
            line-height: 1.25;
            letter-spacing: -0.2px;
            word-break: break-word;
        }

        .card-location {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            word-break: break-word;
        }

        .card-location svg {
            flex-shrink: 0;
            color: var(--red);
        }

        .card-spec {
            background: #0D1525;
            border-left: 3px solid var(--yellow);
            border-top: 1px solid #1E293B;
            border-right: 1px solid #1E293B;
            border-bottom: 1px solid #1E293B;
            padding: 6px 8px;
            margin-bottom: 8px;
        }

        .card-spec-label {
            font-size: 9.5px;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--yellow);
            margin-bottom: 1px;
        }

        .card-spec-value {
            font-size: 12px;
            font-weight: 700;
            color: #E2E8F0;
            word-break: break-word;
        }

        .card-desc {
            font-size: 11.5px;
            color: #94A3B8;
            margin-bottom: 10px;
            line-height: 1.4;
            flex-grow: 1;
            word-break: break-word;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .tag-pill {
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 5px;
            border: 1px solid #334155;
            background: #1E293B;
            color: #CBD5E1;
            text-transform: uppercase;
            border-radius: 0px;
        }

        .tag-pill.tag-safety {
            background: rgba(250, 204, 21, 0.12);
            color: var(--yellow);
            border-color: rgba(250, 204, 21, 0.5);
        }

        .tag-pill.tag-tactical {
            background: rgba(56, 189, 248, 0.12);
            color: var(--cyan);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .tag-pill.tag-pabrik {
            background: rgba(248, 113, 113, 0.12);
            color: var(--red);
            border-color: rgba(248, 113, 113, 0.5);
        }

        /* ACTIONS STRUCTURE (2-TIER FOR MOBILE) */
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 8px;
            border-top: 1.5px dashed #26334D;
            width: 100%;
        }

        .card-actions-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 6px;
            width: 100%;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 8px 6px;
            font-size: 11px;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            border: 1.5px solid #000000;
            box-shadow: var(--shadow-hard-sm);
            cursor: pointer;
            transition: all 0.12s ease;
            min-height: 38px;
            border-radius: var(--radius-sharp);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .btn:active {
            transform: translate(1px, 1px);
            box-shadow: 0px 0px 0px #000000;
        }

        .btn-primary {
            background: var(--yellow);
            color: #000000;
        }

        .btn-maps {
            background: #1E293B;
            color: var(--cyan);
            border-color: #334155;
        }

        /* WHATSAPP ACTION BUTTON */
        .btn-wa {
            background: #22C55E;
            color: #000000;
            font-weight: 900;
            letter-spacing: -0.2px;
            box-shadow: 2.5px 2.5px 0px #000000;
            min-height: 40px;
            font-size: 11.5px;
        }

        .btn-wa:hover {
            background: #4ADE80;
        }

        .btn-wa svg {
            flex-shrink: 0;
        }

        /* EMPTY STATE */
        .empty-state {
            display: none;
            max-width: 480px;
            margin: 30px auto;
            padding: 24px 16px;
            text-align: center;
            background: var(--surface);
            border: 2px solid var(--border-card);
            box-shadow: var(--shadow-hard);
        }

        .empty-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 4px;
        }

        .empty-sub {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 14px;
        }

        /* BOTTOM FLOATING BAR */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            background: rgba(10, 14, 23, 0.96);
            backdrop-filter: blur(10px);
            border-top: 2px solid #000000;
            padding: 8px 14px calc(8px + env(safe-area-inset-bottom)) 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 90;
        }

        .bottom-bar-left {
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .scroll-top-btn {
            background: var(--yellow);
            color: #000000;
            border: 1.5px solid #000000;
            box-shadow: var(--shadow-hard-sm);
            padding: 6px 10px;
            font-size: 10.5px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius-sharp);
        }
    </style>
</head>

                    const matchName = v.name.toLowerCase().includes(query);
                    const matchLoc = v.location.toLowerCase().includes(query);
                    const matchSpec = v.specialty.toLowerCase().includes(query);
                    const matchDesc = v.description.toLowerCase().includes(query);
                    const matchTag = v.tags.some(t => t.toLowerCase().includes(query));
                    if (!matchName && !matchLoc && !matchSpec && !matchDesc && !matchTag) {
                        return false;
                    }
                }

                return true;
            });

            if (filtered.length === 0) {
                vendorGrid.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                vendorGrid.innerHTML = filtered.map(renderCard).join('');
            }

            activeCount.innerText = filtered.length;
            resultStats.innerText = `${filtered.length} DARI 100 VENDOR`;

            if (currentRegion !== 'ALL' || currentTag !== 'ALL' || query.length > 0) {
                resetFiltersBtn.style.display = 'inline-block';
            } else {
                resetFiltersBtn.style.display = 'none';
            }
        }

        // Region Chip Click
        document.querySelectorAll('#regionFilters .chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#regionFilters .chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRegion = btn.dataset.region;
                filterVendors();
            });
        });

        // Tag Chip Click
        document.querySelectorAll('#tagFilters .chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#tagFilters .chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTag = btn.dataset.tag;
                filterVendors();
            });
        });

        // Search Input Handling
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            clearSearchBtn.style.display = searchQuery.length > 0 ? 'flex' : 'none';
            filterVendors();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.style.display = 'none';
            searchInput.focus();
            filterVendors();
        });

        // Reset All
        function resetAllFilters() {
            currentRegion = 'ALL';
            currentTag = 'ALL';
            searchQuery = '';
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';

            document.querySelectorAll('#regionFilters .chip').forEach(b => {
                b.classList.toggle('active', b.dataset.region === 'ALL');
            });

            document.querySelectorAll('#tagFilters .chip').forEach(b => {
                b.classList.toggle('active', b.dataset.tag === 'ALL');
            });

            filterVendors();
        }

        resetFiltersBtn.addEventListener('click', resetAllFilters);

        // Initial render
        filterVendors();
    </script>
</body>
</html>
